name: ❓ Question
description: Ask a question or request help
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [README](https://github.com/doljae/kotlin-logging-extensions#readme) covers setup,
        generation modes, and the case where your IDE shows `log` in red after a successful build.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do and where you got stuck. Include code if it helps.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Only if you are asking about behavior you are actually seeing.
      value: |
        - kotlin-logging-extensions: 3.0.0
        - Kotlin: 2.4.10
        - KSP: 2.3.11
        - kotlin-logging: io.github.oshai:kotlin-logging-jvm:8.0.4
    validations:
      required: false
