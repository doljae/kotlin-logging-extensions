name: ⚠️ Version Compatibility Issue
description: Report version compatibility problems or conflicts
title: "[Version] "
labels: ["version-compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        This template is specifically for version compatibility issues between Kotlin, KSP, and kotlin-logging-extensions.

        **Requirements from `3.0.0`**: JDK 17+, Kotlin 2.0+, a KSP version matching your Kotlin version, kotlin-logging 5.0.0+.
        The library version no longer mirrors your Kotlin version. See the
        [verified compatibility table](https://github.com/doljae/kotlin-logging-extensions#-version-compatibility).

  - type: input
    id: library-version
    attributes:
      label: kotlin-logging-extensions Version
      description: Which version are you using?
      placeholder: "e.g., 3.0.0"
    validations:
      required: true

  - type: input
    id: kotlin-version
    attributes:
      label: Your Kotlin Version
      description: Which Kotlin version are you using?
      placeholder: "e.g., 2.4.10"
    validations:
      required: true

  - type: input
    id: ksp-version
    attributes:
      label: Your KSP Version
      description: Which KSP version are you using?
      placeholder: "e.g., 2.3.11"
    validations:
      required: true

  - type: input
    id: kotlin-logging-version
    attributes:
      label: Your kotlin-logging Version
      description: Which kotlin-logging dependency are you using?
      placeholder: "e.g., io.github.oshai:kotlin-logging-jvm:8.0.4"
    validations:
      required: true

  # Keep this input last: create-release-pr.yml rewrites `placeholder:` lines in this file by
  # position (1=library, 2=Kotlin, 3=KSP, 4=kotlin-logging), so any new input must sit after them.
  - type: input
    id: jdk-version
    attributes:
      label: Your JDK Version
      description: Which JDK is Gradle running on? (`./gradlew -version`)
      placeholder: "e.g., 17"
    validations:
      required: true

  - type: textarea
    id: error-message
    attributes:
      label: Error Message
      description: What error are you getting?
      render: text
      placeholder: |
        e.g., 
        Unresolved reference: log
        or
        Class 'X' was compiled with an incompatible version of Kotlin
    validations:
      required: true

  - type: textarea
    id: build-output
    attributes:
      label: Build Output
      description: Full build error output (if applicable)
      render: text
      placeholder: Paste the complete build error here...
    validations:
      required: false

  - type: checkboxes
    id: attempted-fixes
    attributes:
      label: What I've Tried
      description: Check all that you've attempted
      options:
        - label: Clean build (`./gradlew clean build`)
        - label: Building on JDK 17 or later
        - label: Matching my KSP version to my Kotlin version
        - label: Clearing Gradle cache
        - label: Invalidating IDE caches and restarting

  - type: dropdown
    id: urgency
    attributes:
      label: Impact
      description: How is this affecting your work?
      options:
        - Can't use the library at all
        - Some features don't work
        - Minor inconvenience
        - Just curious about compatibility
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any constraints preventing you from upgrading versions?
      placeholder: "e.g., Other dependencies require older Kotlin version, company policy, etc."
    validations:
      required: false 
