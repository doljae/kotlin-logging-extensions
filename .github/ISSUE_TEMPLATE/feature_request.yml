name: 🚀 Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/doljae/kotlin-logging-extensions#readme) first: what you
        want may already exist, possibly behind a generation mode.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or impossible today, and in what situation you hit it.
      placeholder: |
        Generation is all-or-nothing per module, so I cannot exclude generated DTOs
        without also excluding the services next to them.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead. Configuration or code examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Workarounds you are on now, other approaches you considered and rejected.
    validations:
      required: false
