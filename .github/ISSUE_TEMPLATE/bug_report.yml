name: 🐛 Bug Report
description: Report a bug or unexpected behavior of the library
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Requirements: JDK 17+, Kotlin 2.0+, a KSP version matching your Kotlin version, kotlin-logging 5.0.0+.
        See the [compatibility table](https://github.com/doljae/kotlin-logging-extensions#-version-compatibility)
        before reporting.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Replace the values below with yours.
      value: |
        - kotlin-logging-extensions: 3.0.0
        - Kotlin: 2.4.10
        - KSP: 2.3.11
        - kotlin-logging: io.github.oshai:kotlin-logging-jvm:8.0.4
        - JDK: 17
        - Generation mode: All (default)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
      placeholder: |
        Expected: `log` resolves in every class of the module.
        Actual: compilation fails with "Unresolved reference: log" in classes under `com.example.internal`.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: >
        The smallest build configuration and source that shows it, or a link to a repository.
        Note that `kspTest(...)` is needed separately if the failure is in test sources.
      render: kotlin
      value: |
        plugins {
            kotlin("jvm") version "2.4.10"
            id("com.google.devtools.ksp") version "2.3.11"
        }

        dependencies {
            ksp("io.github.doljae:kotlin-logging-extensions:3.0.0")
            implementation("io.github.oshai:kotlin-logging-jvm:8.0.4")
        }

        // Source that fails
        class MyService {
            fun doWork() = log.info { "..." }
        }
    validations:
      required: true

  - type: textarea
    id: build-output
    attributes:
      label: Build output
      description: The error and stack trace, if there is one.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true
        - label: I reproduced this on a clean build (`./gradlew clean build`)
          required: true
