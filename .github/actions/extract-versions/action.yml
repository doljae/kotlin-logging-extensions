name: 'Extract Project Versions'
description: 'Extracts Kotlin, KSP, and other dependency versions from build scripts'
outputs:
  kotlin_version:
    description: 'Kotlin version'
    value: ${{ steps.extract.outputs.kotlin_version }}
  ksp_version:
    description: 'KSP version'
    value: ${{ steps.extract.outputs.ksp_version }}
  kotlin_logging_version:
    description: 'kotlin-logging version'
    value: ${{ steps.extract.outputs.kotlin_logging_version }}
  logback_version:
    description: 'Logback version'
    value: ${{ steps.extract.outputs.logback_version }}
  kotlin_logging_dependency:
    description: 'Full kotlin-logging-jvm dependency coordinate'
    value: ${{ steps.extract.outputs.kotlin_logging_dependency }}

runs:
  using: "composite"
  steps:
    - name: Extract versions
      id: extract
      run: |
        set -euo pipefail

        # Every extraction takes the FIRST match only.
        #
        # A coordinate may legitimately appear more than once in one build script — processor/
        # declares kotlin-logging-jvm both compileOnly and testImplementation since #150. Without
        # `head -1` the grep returns two lines, and a multi-line value written to $GITHUB_OUTPUT as
        # `key=value` spills a bare second line that Actions rejects with "Invalid format", failing
        # this step. It also produced a README with an embedded newline inside a dependency string.
        # $1 = file, $2 = grep pattern, $3 = sed extraction.
        # Prints nothing instead of failing when there is no match, so the KSP fallback below can
        # still run — GitHub's `shell: bash` already sets -e -o pipefail, which would otherwise abort
        # the whole step on the first miss. An empty result is caught by the validation loop.
        first_match() {
          grep "$2" "$1" | head -1 | sed "$3" || true
        }

        KOTLIN_VERSION=$(first_match build.gradle.kts 'kotlin("jvm") version' 's/.*version "\([^"]*\)".*/\1/')
        KSP_VERSION=$(first_match build.gradle.kts 'id("com.google.devtools.ksp") version' 's/.*version "\([^"]*\)".*/\1/')
        if [ -z "$KSP_VERSION" ]; then
          KSP_VERSION=$(first_match processor/build.gradle.kts 'com.google.devtools.ksp:symbol-processing-api:' 's/.*symbol-processing-api:\([^"]*\)".*/\1/')
        fi
        KOTLIN_LOGGING_VERSION=$(first_match processor/build.gradle.kts 'io.github.oshai:kotlin-logging-jvm:' 's/.*kotlin-logging-jvm:\([^"]*\)".*/\1/')
        LOGBACK_VERSION=$(first_match workload/build.gradle.kts 'ch.qos.logback:logback-classic:' 's/.*logback-classic:\([^"]*\)".*/\1/')

        # Fail loudly here rather than let an empty version silently blank out README coordinates.
        for pair in "kotlin:$KOTLIN_VERSION" "ksp:$KSP_VERSION" "kotlin-logging:$KOTLIN_LOGGING_VERSION" "logback:$LOGBACK_VERSION"; do
          name="${pair%%:*}"
          value="${pair#*:}"
          if [ -z "$value" ]; then
            echo "::error::Could not extract the $name version from the build scripts."
            exit 1
          fi
        done

        echo "kotlin_version=$KOTLIN_VERSION" >> $GITHUB_OUTPUT
        echo "ksp_version=$KSP_VERSION" >> $GITHUB_OUTPUT
        echo "kotlin_logging_version=$KOTLIN_LOGGING_VERSION" >> $GITHUB_OUTPUT
        echo "logback_version=$LOGBACK_VERSION" >> $GITHUB_OUTPUT
        echo "kotlin_logging_dependency=io.github.oshai:kotlin-logging-jvm:$KOTLIN_LOGGING_VERSION" >> $GITHUB_OUTPUT
      shell: bash
