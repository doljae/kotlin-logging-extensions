name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Allow workflow to run on bot PRs
  pull_request_target:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
      run_security:
        description: 'Run security scan'
        required: false
        default: true
        type: boolean

# Add explicit permissions for security features
permissions:
  contents: read
  security-events: write
  actions: read
  # Add permissions for pull_request_target
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Run tests for all PRs and pushes
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_target' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == true)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Setup Gradle
      uses: ./.github/actions/setup-gradle
      
    - name: Build and Test
      run: ./gradlew build ktlintCheck test
      
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: |
          **/build/test-results/**/*.xml
          **/build/reports/tests/**/*
          
  security:
    runs-on: ubuntu-latest
    # Only run security scanning on public repositories or when explicitly enabled
    if: >
      (github.event.repository.private == false || github.event_name == 'schedule') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.run_security == true) &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'pull_request_target' ||
        github.event_name == 'push' ||
        github.event_name == 'schedule'
      )
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
  # Alternative security job for private repositories
  security-private:
    runs-on: ubuntu-latest
    if: >
      github.event.repository.private == true &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.run_security == true) &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'pull_request_target' ||
        github.event_name == 'push' ||
        github.event_name == 'schedule'
      )
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'json'
        output: 'trivy-results.json'
        
    - name: Upload security scan results as artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-results
        path: trivy-results.json 
